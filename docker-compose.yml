services:
  app:
    build: .
    container_name: carniceria_app
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=server=mysql_db;port=3306;database=carniceria_db;user=root;password=TU_PASSWORD_SEGURO;
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - carniceria_net

  mysql_db:
    image: mysql:8.0
    container_name: carniceria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: TU_PASSWORD_SEGURO
      MYSQL_DATABASE: carniceria_db
    ports:
      - "3308:3306"
    volumes:
      - carniceria_mysql_data:/var/lib/mysql
    networks:
      - carniceria_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTU_PASSWORD_SEGURO"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carniceria_mysql_data:

networks:
  carniceria_net:
    driver: bridge