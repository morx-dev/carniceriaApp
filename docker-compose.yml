version: '3.8'

services:
  app:
    build: .
    container_name: carniceria_app
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - mysql_db
    networks:
      - carniceria_net

  mysql_db:
    image: mysql:8.0
    container_name: carniceria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: TU_PASSWORD_SEGURO
      MYSQL_DATABASE: carniceria_db
    ports:
      - "3308:3306"
    volumes:
      - carniceria_mysql_data:/var/lib/mysql
    networks:
      - carniceria_net

volumes:
  carniceria_mysql_data:

networks:
  carniceria_net:
    driver: bridge